name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run check:migraciones
      - run: npm run typecheck
      - run: npm test
  base-de-datos:
    # Tests de SQL contra un Postgres embebido (pgserver), los mismos que se corren a mano.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pgserver psycopg2-binary
      - name: Correr todos los tests de supabase/tests
        run: |
          set -e
          for t in supabase/tests/*_test.py; do echo "== $t"; python3 "$t"; done
